# Project-wide Gradle settings.
# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx4608m -Dfile.encoding=UTF-8

# Pin the Gradle daemon to a JDK the Kotlin/KSP toolchain understands.
# System default JDKs (25/26) crash KSP's bundled IntelliJ version parser.
org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-17.0.20.8-hotspot

# Parallel execution and caching
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Kotlin Code Style
kotlin.code.style=official

# AndroidX & Modern Gradle Flags
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true

# Google Services fallback
googleServices.missing.passthrough=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
